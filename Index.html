<!doctype html>
<html lang="es"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visión 360</title>
<style>
:root{--green:#2ea84f;--ink:#17202a;--muted:#7b8490;--line:#e4e6e0;--bg:#f5f5f1}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px Arial,sans-serif;color:var(--ink)}button,input,select{font:inherit}button,select{cursor:pointer}header{min-height:88px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:22px;padding:16px 24px;flex-wrap:wrap}.brand{font-size:23px;font-weight:700;white-space:nowrap}.brand:before{content:'';display:inline-block;width:11px;height:34px;background:var(--green);border-radius:3px;vertical-align:middle;margin-right:12px}.brand small{font-size:14px;font-weight:400;color:var(--muted);margin-left:9px}nav{display:flex;padding:5px;background:#efefeb;border-radius:13px;gap:3px}nav button{border:0;background:none;padding:11px 16px;color:#626975;border-radius:9px}nav button.active{background:white;color:#17202a;box-shadow:0 2px 5px #0001}.search{flex:1;min-width:220px;border:1px solid #d5d8d0;border-radius:12px;padding:13px 17px;outline:none}.search:focus{border-color:var(--green);box-shadow:0 0 0 4px #2ea84f18}.outline{background:white;border:1px solid #d5d8d0;border-radius:11px;padding:12px 17px}.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:24px;padding:26px;max-width:1750px;margin:auto}aside,.panel{background:white;border:1px solid var(--line);border-radius:19px;padding:25px}aside{align-self:start;position:sticky;top:20px}h1{font-size:24px;line-height:1.3;margin:0 0 9px}h2{font-size:20px;margin:0 0 8px}h3{font-size:16px;margin:0 0 16px}.green{color:#16883c}.muted,.sub{color:var(--muted);line-height:1.5}.sub{font-size:13px;margin:8px 0 18px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:24px 0}.metric{text-align:center;background:var(--bg);border-radius:13px;padding:17px 4px}.metric strong{font-size:25px;display:block;margin-bottom:8px}.metric span{font-size:12px;color:#65707b}label{font-size:12px;font-weight:bold;letter-spacing:.7px;display:block;color:var(--muted);margin:22px 0 9px}select{width:100%;border:1px solid var(--line);border-radius:9px;background:white;padding:11px}.courses{display:grid;gap:8px}.course{text-align:left;border:0;border-left:5px solid #8ac441;background:white;padding:14px;border-radius:6px;line-height:1.45}.course small{display:block;color:var(--muted);margin-top:4px}.course.active{background:var(--green);color:white;border-color:var(--green)}.course.active small{color:#e0f6e5}.aside-note{font-size:12px;color:var(--muted);line-height:1.6;border-top:1px solid var(--line);padding-top:18px;margin-top:24px}.main{min-width:0}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:20px}.toolbar p{margin:4px 0}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:20px}.kpi{background:white;border:1px solid var(--line);border-radius:15px;padding:20px}.kpi span{font-size:13px;color:#68727b}.kpi strong{display:block;font-size:30px;margin:12px 0 6px}.kpi small{color:var(--muted);font-size:11px}.graphs{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;margin-bottom:20px}.canvas-wrap{height:245px;position:relative}canvas{width:100%;height:100%}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}th{text-align:left;color:#68717b;font-size:11px;letter-spacing:.6px;padding:15px 12px;background:#fafaf8}td{padding:14px 12px;border-bottom:1px solid #efefeb}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2ea84f;margin-right:7px}.dot.warn{background:#e48b19}.note{font-size:12px;color:#737e86;line-height:1.6;margin-top:16px}.error{background:#fff1ee;border:1px solid #f2c4b8;color:#942e13;padding:16px;margin-bottom:20px;border-radius:10px;white-space:pre-wrap}.status{font-size:12px;color:#7b8490}footer{padding:20px 0;color:#7b8490;font-size:12px}.wide-chart{height:340px}.loading{opacity:.5;pointer-events:none}.tag{font-size:12px;background:#eaf5ec;color:#257c3b;padding:5px 8px;border-radius:5px}.screenonly{display:initial}@media(max-width:1050px){.layout{grid-template-columns:270px 1fr;padding:18px;gap:16px}.kpis{grid-template-columns:repeat(2,1fr)}.graphs{grid-template-columns:1fr}header{gap:12px}nav button{padding:10px}.brand small{display:none}}@media(max-width:720px){.layout{grid-template-columns:1fr}aside{position:static}.metrics{margin:15px 0}.kpis{grid-template-columns:repeat(2,1fr)}nav{width:100%;justify-content:space-between}nav button{font-size:13px}header{padding:14px}.layout{padding:12px}.panel,aside{padding:18px}.search{min-width:100px}.toolbar{align-items:start}}@media print{header nav,header input,header button,aside,.screenonly{display:none!important}.layout{display:block;padding:0}body{background:white}.panel,.kpi{break-inside:avoid}.main{width:100%}.graphs{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:repeat(4,1fr)}header{border:0;padding:10px 0}.panel{margin-bottom:15px}.canvas-wrap{height:200px}}
</style></head><body>
<header><div class="brand">Visión 360 <small>CIENCIAS</small></div><nav id="tabs"></nav><input class="search" id="search" placeholder="Buscar código de estudiante…" aria-label="Buscar estudiante"><button class="outline" onclick="window.print()">Imprimir</button></header>
<div class="layout"><aside><h1>Progreso escolar</h1><div class="green" id="scope">Laboratorio docente</div><div class="metrics"><div class="metric"><strong id="nStudents">—</strong><span>estudiantes</span></div><div class="metric"><strong id="nCourses">—</strong><span>cursos</span></div><div class="metric"><strong id="nPeriods">—</strong><span>periodos</span></div></div><label for="period">PERIODO</label><select id="period"></select><label for="section">SECCIÓN</label><select id="section"></select><label>CURSOS</label><div class="courses" id="courses"></div><div class="aside-note" id="rules"></div><button class="outline screenonly" id="reload" style="margin-top:15px;width:100%">Actualizar datos</button></aside>
<main class="main"><div id="error" class="error" hidden></div><div class="toolbar"><div><h2 id="heading">Resumen académico</h2><p class="muted" id="subtitle">Cargando datos…</p></div><span class="tag" id="mode">Conectando</span></div><div id="content"></div><footer id="status" class="status" role="status" aria-live="polite"></footer></main></div>
<script>
'use strict';
let DATA=null,tab='Resumen',course='Todos',timer;
const $=id=>document.getElementById(id),num=x=>typeof x==='number'&&Number.isFinite(x),mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null,fmt=x=>num(x)?x.toFixed(2):'Sin datos',pct=x=>num(x)?(100*x).toFixed(1)+'%':'Sin datos';
function el(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x;}
function box(title,sub){const x=el('section',undefined,'panel');x.append(el('h3',title));if(sub)x.append(el('p',sub,'sub'));return x;}
function opts(id,values,current){$(id).replaceChildren(...values.map(v=>{const o=el('option',v);o.value=v;return o;}));$(id).value=values.includes(current)?current:values[0];}
function load(){
 $('reload').disabled=true;$('status').textContent='Leyendo y validando las fuentes…';$('error').hidden=true;
 const success=d=>{DATA=d;$('reload').disabled=false;init();};
 if(window.google&&google.script&&google.script.run){google.script.run.withSuccessHandler(success).withFailureHandler(e=>{$('reload').disabled=false;$('error').hidden=false;$('error').textContent=e.message||String(e);$('status').textContent='No se pudo actualizar. Los datos mostrados pueden estar desactualizados.';}).obtenerDatos();}
 else {$('reload').disabled=false;$('error').hidden=false;$('error').textContent='Esta interfaz necesita Google Apps Script para leer tu hoja. Abre la URL de la aplicación web, no el archivo HTML local.';$('subtitle').textContent='Sin conexión a Google Sheets';$('mode').textContent='SIN CONEXIÓN';$('status').textContent='No se han cargado datos.';}
}
function init(){
 const periods=[...new Set(DATA.integrada.map(r=>r[2]))].sort(),sections=['Todas',...new Set(DATA.alumnos.map(r=>r[1]))];
 opts('period',periods,$('period').value||periods.at(-1));opts('section',sections,$('section').value);
 $('nStudents').textContent=DATA.alumnos.length;$('nCourses').textContent=new Set(DATA.integrada.map(r=>r[3])).size;$('nPeriods').textContent=periods.length;
 $('mode').textContent='GOOGLE SHEETS';
 $('rules').textContent='Reglas del taller: nota <'+DATA.config.aprobacion+', asistencia <'+Math.round(DATA.config.asistencia*100)+'% y entregas <'+Math.round(DATA.config.entrega*100)+'%. Las alertas requieren revisión docente. Los vacíos no equivalen a cero.';
 const courses=['Todos',...new Set(DATA.integrada.map(r=>r[3]))];if(!courses.includes(course))course='Todos';
 $('courses').replaceChildren(...courses.map((c,i)=>{const b=el('button',c==='Todos'?'Todos los cursos':c,'course'+(course===c?' active':''));b.style.borderLeftColor=['#2ea84f','#00a6db','#874be2'][i%3];b.append(el('small',c==='Todos'?'Vista integrada':'Tres competencias por periodo'));b.onclick=()=>{course=c;init();};return b;}));render();
}
function baseRows(){const sec=$('section').value,q=$('search').value.trim().toUpperCase();return DATA.integrada.filter(r=>(sec==='Todas'||r[1]===sec)&&(course==='Todos'||r[3]===course)&&(!q||r[0].toUpperCase().includes(q)));}
function table(headers,rows){const w=el('div',undefined,'tablewrap'),t=el('table'),thead=el('thead'),tr=el('tr');headers.forEach(h=>tr.append(el('th',h)));thead.append(tr);t.append(thead);const b=el('tbody');rows.forEach(row=>{const r=el('tr');row.forEach(v=>{const td=el('td');if(v instanceof Node)td.append(v);else td.textContent=v;r.append(td);});b.append(r);});t.append(b);w.append(t);return w;}
function chart(title,labels,values,type='line',max=20){const p=box(title),wrap=el('div',undefined,'canvas-wrap'),c=el('canvas');c.setAttribute('role','img');c.setAttribute('aria-label',title+': '+labels.map((x,i)=>x+' '+fmt(values[i])).join(', '));wrap.append(c);p.append(wrap);requestAnimationFrame(()=>draw(c,labels,values,type,max));return p;}
function draw(c,labels,values,type,max){const rect=c.getBoundingClientRect(),ratio=window.devicePixelRatio||1;c.width=Math.max(1,rect.width)*ratio;c.height=Math.max(1,rect.height)*ratio;const g=c.getContext('2d');g.scale(ratio,ratio);const w=rect.width,h=rect.height,L=40,R=15,T=25,B=35,cw=w-L-R,ch=h-T-B;if(cw<1)return;g.font='12px Arial';g.fillStyle='#7b8490';for(let i=0;i<=4;i++){const y=T+ch-i*ch/4;g.strokeStyle='#eceee8';g.beginPath();g.moveTo(L,y);g.lineTo(w-R,y);g.stroke();g.fillText((max*i/4).toFixed(max===20?0:1),3,y+4);}const step=cw/Math.max(labels.length,1);if(type==='bar'){values.forEach((v,i)=>{if(!num(v))return;const bh=ch*v/max;g.fillStyle=['#f0a52a','#8962d9','#00a5d3','#2ea84f'][i%4];g.fillRect(L+i*step+step*.2,T+ch-bh,step*.6,bh);g.fillStyle='#44515a';g.fillText(String(v),L+i*step+step*.4,T+ch-bh-7);});}else{g.strokeStyle='#2ea84f';g.lineWidth=2.5;let open=false;g.beginPath();values.forEach((v,i)=>{if(!num(v)){open=false;return;}const x=L+step*(i+.5),y=T+ch-ch*v/max;if(open)g.lineTo(x,y);else g.moveTo(x,y);open=true;});g.stroke();values.forEach((v,i)=>{if(!num(v))return;const x=L+step*(i+.5),y=T+ch-ch*v/max;g.beginPath();g.arc(x,y,4,0,Math.PI*2);g.fillStyle='#2ea84f';g.fill();g.fillStyle='#44515a';g.fillText(v.toFixed(1),x-10,y-12);});}g.fillStyle='#7b8490';g.textAlign='center';labels.forEach((v,i)=>g.fillText(v,L+step*(i+.5),h-10));}
function render(){
 if(!DATA)return;const period=$('period').value,base=baseRows(),rows=base.filter(r=>r[2]===period),notes=rows.filter(r=>num(r[4])),people=new Set(rows.map(r=>r[0]));
 $('tabs').replaceChildren(...['Resumen','Estudiantes','Competencias','Evolución'].map(n=>{const b=el('button',n,n===tab?'active':'');b.onclick=()=>{tab=n;render();};return b;}));
 $('heading').textContent={Resumen:'Resumen académico',Estudiantes:'Seguimiento de estudiantes',Competencias:'Resultados por competencia',Evolución:'Evolución del aprendizaje'}[tab];
 $('subtitle').textContent=period+' · '+($('section').value==='Todas'?'Todas las secciones':'Sección '+$('section').value)+' · '+(course==='Todos'?'Todos los cursos':course)+' · '+people.size+' estudiantes';
 const content=$('content');content.replaceChildren();if(!rows.length){content.append(box('Sin resultados','Cambie los filtros o la búsqueda.'));return;}
 const rates=[...new Map(rows.filter(r=>num(r[5])).map(r=>[r[0],r[5]])).values()],expected=rows.reduce((s,r)=>s+r[8],0),coverage=expected?rows.reduce((s,r)=>s+r[7],0)/expected:null;
 const k=el('div',undefined,'kpis');[[fmt(mean(notes.map(r=>r[4]))),'Promedio','Media de registros alumno-curso'],[notes.length?pct(notes.filter(r=>r[4]>=DATA.config.aprobacion).length/notes.length):'Sin datos','Aprobación','Registros con nota ≥'+DATA.config.aprobacion],[pct(mean(rates)),'Asistencia','Media por estudiante'],[pct(coverage),'Cobertura','Notas válidas / notas esperadas']].forEach(([v,l,n])=>{const a=el('div',undefined,'kpi');a.append(el('span',l),el('strong',v),el('small',n));k.append(a);});content.append(k);
 const periods=[...new Set(DATA.integrada.map(r=>r[2]))].sort(),trend=periods.map(p=>mean(base.filter(r=>r[2]===p&&num(r[4])).map(r=>r[4])));
 if(tab==='Resumen'||tab==='Evolución'){const graphs=el('div',undefined,'graphs');graphs.append(chart('Evolución del promedio · escala 0–20',periods,trend));const bins=[0,0,0,0];notes.forEach(r=>bins[r[4]<11?0:r[4]<14?1:r[4]<17?2:3]++);graphs.append(chart('Distribución de promedios alumno-curso',['0–<11','11–<14','14–<17','17–20'],bins,'bar',Math.max(4,...bins)));content.append(graphs);}
 if(tab==='Competencias'){
  const keys=new Set(rows.map(r=>JSON.stringify([r[0],r[2],r[3]]))),groups=new Map();
  DATA.evaluaciones.filter(r=>keys.has(JSON.stringify([r[0],r[1],r[2]]))).forEach(r=>{const key=r[2]+' / '+r[3];if(!groups.has(key))groups.set(key,{v:[],total:0});const a=groups.get(key);a.total++;if(num(r[4]))a.v.push(r[4]);});
  const p=box('Competencias del periodo','Misma ponderación para cada competencia.');p.append(table(['CURSO / COMPETENCIA','PROMEDIO','NOTAS VÁLIDAS','COBERTURA'],[...groups].map(([n,a])=>[n,fmt(mean(a.v)),a.v.length+' / '+a.total,pct(a.v.length/a.total)])));content.append(p);
 }else if(tab==='Evolución'){
  const ids=[...people].sort(),p=box('Trayectorias por estudiante','La tabla y la curva recorren todos los periodos con los filtros actuales de sección, curso y estudiante.');
  p.append(table(['ESTUDIANTE',...periods,'CAMBIO PAREADO'],ids.map(id=>{const vals=periods.map(p=>mean(base.filter(r=>r[0]===id&&r[2]===p&&num(r[4])).map(r=>r[4])));const first=new Map(base.filter(r=>r[0]===id&&r[2]===periods[0]&&num(r[4])).map(r=>[r[3],r[4]]));const delta=base.filter(r=>r[0]===id&&r[2]===periods.at(-1)&&num(r[4])&&first.has(r[3])).map(r=>r[4]-first.get(r[3]));return[id,...vals.map(fmt),fmt(mean(delta))];})));content.append(p);
 }else{
  const p=box(tab==='Estudiantes'?'Registros de estudiantes':'Detalle del periodo','Una fila por estudiante y curso. Las alertas son reglas de revisión del taller.');
  p.append(table(['ESTUDIANTE','SECCIÓN','CURSO','NOTA','ASISTENCIA','ENTREGAS','REVISIÓN'],rows.map(r=>{const signal=el('span');signal.append(el('i',undefined,'dot'+(r[9]==='Sin alertas'?'':' warn')),document.createTextNode(r[9]));return[r[0],r[1],r[3],num(r[4])?fmt(r[4]):'Sin nota',num(r[5])?pct(r[5]):'Sin dato',num(r[6])?pct(r[6]):'Sin dato',signal];})));content.append(p);
 }
 content.append(el('p','Promedios sobre competencias disponibles, con igual peso. La evolución exige pruebas comparables. Los cambios observados no demuestran causalidad.','note'));
 $('status').textContent='Datos leídos de Google Sheets. '+'Actualización: '+new Date(DATA.actualizado).toLocaleString('es-PE')+'.';
}
$('period').onchange=render;$('section').onchange=render;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(render,120);};$('reload').onclick=load;window.addEventListener('resize',()=>{clearTimeout(timer);timer=setTimeout(render,180);});load();
</script></body></html>
